$kind: http-request
name: Get Booking by ID
method: GET
url: '{{baseUrl}}/api/bookings/{{bookingId}}'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("success is true", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.be.true;
      });

      pm.test("Response has booking object", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("booking");
      });

      pm.test("booking._id equals bookingId", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.booking._id).to.eql(pm.environment.get("bookingId"));
      });
