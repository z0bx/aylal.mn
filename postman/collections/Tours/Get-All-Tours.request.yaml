$kind: http-request
method: GET
order: 1000
url: '{{baseUrl}}/api/tours'
queryParams:
  - key: page
    value: '1'
  - key: limit
    value: '10'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("success is true", function () {
          var json = pm.response.json();
          pm.expect(json.success).to.be.true;
      });

      pm.test("Response has tours array", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("tours");
          pm.expect(json.tours).to.be.an("array");
      });

      pm.test("Response has pagination fields", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("total");
          pm.expect(json).to.have.property("count");
          pm.expect(json).to.have.property("page");
          pm.expect(json).to.have.property("pages");
      });
